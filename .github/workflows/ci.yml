name: CI

# Trimmed from OpenPocketCine's ci.yml to what this repo has. One suite per
# pull request; post-merge coverage is `push` to main. Required check on `main`
# is **CI gate**: native / android / handbook skip when their paths did not
# change, and a skip is success. Do not add those job names to branch protection.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists changed PR files via the API

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Meta checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The app's release-note scripts delegate to the pinned shared validators.
      - name: Check out pinned OpenCine for shared metadata checks
        run: scripts/checkout-opencine.sh

      - name: Gitleaks
        # Digest-pinned for reproducibility. Update the version manually when needed. v8.30.1
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          # Scan this candidate and every ancestor, excluding unrelated fetched branches.
          args: "detect --source=. --redact --no-banner --log-opts=HEAD"

      - name: Sentry release configuration
        # OpenCine's shared Sentry tooling, run against this app's Xcode Cloud archive hook.
        run: |
          OPC_APP_ROOT=. OPC_APP_NAME=OpenInstaCine bash ../OpenCine/scripts/sentry/sentry-test.sh
          python3 tools/ios-package-resolved-check.py
          bash scripts/ios-package-resolved-test.sh

      - name: Packaged iOS privacy regression
        run: python3 -m unittest discover -s tools -p 'test_ios_archive_privacy.py'

      - name: TestFlight notes
        run: |
          ./scripts/ios-release-notes-check.sh
          ./scripts/ios-release-notes-test.sh

      - name: Play notes
        run: |
          ./scripts/android-release-notes-check.sh
          ./scripts/android-release-notes-test.sh

      - name: Require reviewed notes for TestFlight-triggering pull requests
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed_files="$(git log --diff-merges=combined --format= --name-only "$BASE_SHA..HEAD" | sort -u)"
          production_files="$(grep -E '^(Sources/|ios/|Package\.swift$|opencine-pins\.txt$|scripts/ios-)' <<< "$changed_files" | grep -vE '^(scripts/ios-release-notes|ios/OpenInstaCine(UI)?Tests/|ios/LunaOfficialUITests/|ios/ci_scripts/)' || true)"
          if [[ -n "$production_files" ]]; then
            if ! grep -Fxq 'ios/TestFlight/WhatToTest.en-US.txt' <<< "$changed_files"; then
              echo "Update ios/TestFlight/WhatToTest.en-US.txt with the this-build window." >&2
              exit 1
            fi
          fi

      - name: Require reviewed notes for Play-triggering pull requests
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed_files="$(git log --diff-merges=combined --format= --name-only "$BASE_SHA..HEAD" | sort -u)"
          production_files="$(grep -E '^(Apps/Android/|Sources/OpenInstaViewCore/|Sources/OpenInstaCineAndroidFacade/|Package\.swift$|opencine-pins\.txt$|scripts/android-|scripts/ci-install-swift-android\.sh$)' <<< "$changed_files" | grep -vE '^(scripts/android-release-notes|Apps/Android/[^/]+/src/(test|androidTest|debug)/)' || true)"
          if [[ -n "$production_files" ]]; then
            if ! grep -Fxq 'Apps/Android/Play/WhatToTest.en-US.txt' <<< "$changed_files"; then
              echo "Update Apps/Android/Play/WhatToTest.en-US.txt with the this-build window." >&2
              exit 1
            fi
            if ! grep -Fxq 'Apps/Android/Play/whatsnew/whatsnew-en-US' <<< "$changed_files"; then
              echo "Update Apps/Android/Play/whatsnew/whatsnew-en-US (Play allows 500 characters)." >&2
              exit 1
            fi
          fi

      - name: Actionlint
        # Digest-pinned for reproducibility. Update the version manually when needed. v1.7.12
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: "-color"

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      android: ${{ steps.filter.outputs.android }}
      handbook: ${{ steps.filter.outputs.handbook }}
    steps:
      # paths-filter fetches the base ref on push / dispatch, so this job keeps the
      # checkout credentials. It runs no repository code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch default branch for path filter
        run: |
          set -euo pipefail
          default_branch="${{ github.event.repository.default_branch }}"
          git fetch --no-tags origin \
            "refs/heads/${default_branch}:refs/remotes/origin/${default_branch}"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            code:
              - 'Sources/**'
              - 'Tests/**'
              - 'ios/**'
              - 'Package.swift'
              - 'opencine-pins.txt'
              - 'scripts/checkout-opencine.sh'
              - 'justfile'
              - '.github/workflows/ci.yml'
            android:
              - 'Apps/Android/**'
              - 'Sources/OpenInstaViewCore/**'
              - 'Sources/OpenInstaCineAndroidFacade/**'
              - 'Package.swift'
              - 'opencine-pins.txt'
              - 'scripts/checkout-opencine.sh'
              - 'scripts/android-*.sh'
              - 'scripts/ci-install-swift-android.sh'
              - 'justfile'
              - '.github/workflows/ci.yml'
            handbook:
              - 'handbook/**'
              - '.github/workflows/ci.yml'

  native:
    name: Native Swift/iOS
    needs: changes
    # Hosted macOS is free on public repositories only. Never move this to a
    # self-hosted runner: it runs pull-request code.
    if: ${{ needs.changes.outputs.code == 'true' && !github.event.repository.private }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Install native tooling
        run: brew install just xcodegen || true
      # Candidate (OpenCine): ios/project.yml takes MonitorUI and MonitorPresentation, OpenCineCore
      # plus OpenCineMedia (also Package.swift), and Insta360Protocol plus Insta360Apple
      # (`just core-test` tests them) from ../OpenCine, one sibling checkout pinned by SHA in
      # opencine-pins.txt. Works only once that repository is published. Delete when the app pins
      # it by url + version.
      - name: Check out pinned OpenCine next to the repository
        run: scripts/checkout-opencine.sh
      - name: Swift packages
        run: just core-test
      - name: Original storage oracle on a private native 2x iPad
        env:
          TEST_RUNNER_CI: "true"
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/native-storage-oracle"
          mkdir -p "$evidence"
          just ios-generate
          udid=""
          trap 'if [ -n "$udid" ]; then python3 ../OpenCine/scripts/ios-private-simulator.py delete "$udid"; fi' EXIT
          udid=$(python3 ../OpenCine/scripts/ios-private-simulator.py create \
            "opc-insta-storage-2x-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --device "iPad Pro 11-inch (M4)" --report "$evidence/simulator-setup.json")
          xcodebuild -project ios/OpenInstaCine.xcodeproj -scheme OpenInstaCine \
            -destination "platform=iOS Simulator,id=$udid" -parallel-testing-enabled NO \
            -resultBundlePath "$evidence/storage-oracle.xcresult" \
            -only-testing:OpenInstaCineTests/MonitorPortraitHeaderClearanceTests/testCompactDeclaredGaugeRetainsClearanceWhenSafeTopChanges test
      - name: Retain original storage oracle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-storage-oracle-evidence
          path: ${{ runner.temp }}/native-storage-oracle
          retention-days: 7
          if-no-files-found: error
      - name: iOS unit tests
        # Xcode forwards TEST_RUNNER_ variables into the test host.
        # Preserve the existing hosted-CI versus hardware timing contract.
        env:
          TEST_RUNNER_CI: "true"
        run: just ios-test -only-testing:OpenInstaCineTests -skip-testing:OpenInstaCineTests/MonitorPortraitHeaderClearanceTests/testCompactDeclaredGaugeRetainsClearanceWhenSafeTopChanges

  conformance:
    name: Shared conformance scenarios, iOS
    needs: changes
    # Hosted macOS, public repositories only, for the same reasons as `native`: it runs code from
    # the pull request.
    if: ${{ needs.changes.outputs.code == 'true' && !github.event.repository.private }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Install native tooling
        run: brew install just xcodegen || true
      - name: Check out pinned OpenCine next to the repository
        run: scripts/checkout-opencine.sh
      # OpenCine's scripts/ios-private-simulator.py: a new iPhone 16 Pro with accessibility enabled in
      # its own preference store only, the setup every app's conformance job shares.
      - name: Create a private simulator with accessibility enabled
        run: |
          mkdir -p "$RUNNER_TEMP/conformance-ios"
          udid=$(../OpenCine/scripts/ios-private-simulator.py create \
            "opc-insta-conformance-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --report "$RUNNER_TEMP/conformance-ios/simulator-setup.json")
          echo "CONFORMANCE_DEVICE_ID=$udid" >> "$GITHUB_ENV"
      - name: Run the shared scenarios (OpenInstaCineUIReview)
        run: just conformance-ios "$CONFORMANCE_DEVICE_ID" "$RUNNER_TEMP/conformance-ios/OpenInstaCineUIReview.xcresult"
      - name: Delete the private simulator
        if: always()
        run: |
          if [ -n "${CONFORMANCE_DEVICE_ID:-}" ]; then
            ../OpenCine/scripts/ios-private-simulator.py delete "$CONFORMANCE_DEVICE_ID"
          fi
      - name: Retain conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-ios-evidence
          path: ${{ runner.temp }}/conformance-ios
          retention-days: 7
          if-no-files-found: warn

  android:
    name: Android
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # OpenCine candidate wiring. Apps/Android/settings.gradle.kts includes ../../../OpenCine/Android
      # (monitor-ui, core, media, vulkan, the Insta360 shell contract and Luna adapter; their tests run
      # in OpenCine's CI), and the Swift Android core links OpenCineMedia from ../OpenCine: one sibling
      # checkout pinned by SHA in opencine-pins.txt. Works only once that remote exists (owner/URL
      # not final).
      - name: Check out pinned OpenCine next to the repository
        run: scripts/checkout-opencine.sh
      # The install script needs NDK 27 for the Swift Android SDK sysroot.
      - name: Set up Android NDK 27
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27c
          link-to-sdk: true
      - name: Install Swift Android SDK
        run: ./scripts/ci-install-swift-android.sh
      # The release bundle is built on every pull request, as OpenZCine does: R8 only runs there, and
      # :app:verifyReleaseComponentRegistrars (OpenCine's dex check) fails when it strips the ML Kit
      # ComponentRegistrar constructors (OPENINSTACINE-ANDROID-1). Unsigned without the Play keystore.
      - name: Build, unit-test, lint, and verify the release bundle
        working-directory: Apps/Android
        env:
          SWIFT_ANDROID_SDK_ID: swift-6.3.3-RELEASE_android
        run: ./gradlew :app:assembleDebug :monitor:testDebugUnitTest :app:lintDebug :monitor:lintDebug :app:verifyReleaseComponentRegistrars

  handbook:
    name: Handbook
    needs: changes
    if: ${{ needs.changes.outputs.handbook == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same pin as OpenPocketCine's handbook job. Astro needs Node 22.12 or newer.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: handbook/package-lock.json
      - name: Install handbook dependencies
        run: npm --prefix handbook ci
      - name: Build handbook at /openinstacine/docs/
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          HANDBOOK_BASE: /openinstacine/docs
        run: npm --prefix handbook run build

  gate:
    name: CI gate
    # The single required status check on `main`. Always runs and collapses every
    # other job into one verdict; path-filter and private-repo skips are success.
    if: always()
    needs: [meta, changes, native, conformance, android, handbook]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed or been deliberately skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::a CI job reported '$result'"
                exit 1
                ;;
            esac
          done
          echo "All CI jobs passed or were skipped: $RESULTS"
