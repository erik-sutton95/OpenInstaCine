name: CI

# Trimmed from OpenPocketCine's ci.yml to what this repo has. One suite per
# pull request; post-merge coverage is `push` to main. Required check on `main`
# is **CI gate**: native / android / handbook skip when their paths did not
# change, and a skip is success. Do not add those job names to branch protection.
#
# Two tiers (docs/ci.md): this is the fast PR tier. nightly.yml calls it with
# `full: true`, which runs every job regardless of paths and adds the simulator
# conformance suite and the iPad storage oracle (its own job, beside the native job).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Run every job regardless of paths, plus the nightly-only suites
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists changed PR files via the API

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel only a superseded pull-request run. Main pushes, dispatches and the nightly's call run
  # to completion (a newer pending main run still replaces an older pending one).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  meta:
    name: Meta checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Warn when the OpenCine pin is behind
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pin="$(awk '$1 == "OpenCine" { print $2; exit }' opencine-pins.txt)"
          core_sha="$(git ls-remote https://github.com/erik-sutton95/OpenCine.git refs/heads/main | cut -f1 || true)"
          if [ -z "$pin" ] || [ -z "$core_sha" ] || [ "$pin" = "$core_sha" ]; then
            exit 0
          fi
          ahead="$(gh api "repos/erik-sutton95/OpenCine/compare/${pin}...${core_sha}" --jq '.ahead_by' 2>/dev/null || true)"
          if [ -n "$ahead" ] && [ "$ahead" != "0" ]; then
            echo "::warning::OpenCine pin ${pin:0:7} is ${ahead} commits behind Core main ${core_sha:0:7}"
          fi

      # The app's release-note scripts delegate to the pinned shared validators.
      - name: Check out pinned OpenCine for shared metadata checks
        run: scripts/checkout-opencine.sh

      - name: Gitleaks
        # Digest-pinned for reproducibility. Update the version manually when needed. v8.30.1
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          # Scan this candidate and every ancestor, excluding unrelated fetched branches.
          args: "detect --source=. --redact --no-banner --log-opts=HEAD"

      - name: Sentry release configuration
        # OpenCine's shared Sentry tooling, run against this app's Xcode Cloud archive hook.
        run: |
          OPC_APP_ROOT=. OPC_APP_NAME=OpenInstaCine bash ../OpenCine/scripts/sentry/sentry-test.sh
          python3 tools/ios-package-resolved-check.py
          bash scripts/ios-package-resolved-test.sh

      - name: Packaged iOS privacy regression
        run: python3 -m unittest discover -s tools -p 'test_ios_archive_privacy.py'

      - name: TestFlight notes
        run: |
          ./scripts/ios-release-notes-check.sh
          ./scripts/ios-release-notes-test.sh

      - name: Play notes
        run: |
          ./scripts/android-release-notes-check.sh
          ./scripts/android-release-notes-test.sh

      - name: CI timing summaries
        run: python3 scripts/ci-test-timing-test.py

      - name: Swift Android SDK install recovery
        run: ./scripts/ci-install-swift-android-test.sh

      - name: Waiting for the native build (iPad oracle)
        run: ./scripts/ci-wait-for-artifact-test.sh

      - name: Actionlint
        # Digest-pinned for reproducibility. Update the version manually when needed. v1.7.12
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: "-color"

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # The pin bot dispatches CI on bot/pin-core after a GITHUB_TOKEN push, which
      # does not trigger pull_request. Run the shared-core jobs as if the pin changed.
      # The nightly full suite runs every job.
      code: ${{ steps.filter.outputs.code == 'true' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'bot/pin-core') || inputs.full }}
      android: ${{ steps.filter.outputs.android == 'true' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'bot/pin-core') || inputs.full }}
      handbook: ${{ steps.filter.outputs.handbook == 'true' || inputs.full }}
    steps:
      # paths-filter fetches the base ref on push / dispatch, so this job keeps the
      # checkout credentials. It runs no repository code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch default branch for path filter
        run: |
          set -euo pipefail
          default_branch="${{ github.event.repository.default_branch }}"
          git fetch --no-tags origin \
            "refs/heads/${default_branch}:refs/remotes/origin/${default_branch}"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            code:
              - 'Sources/**'
              - 'Tests/**'
              - 'ios/**'
              - 'Package.swift'
              - 'opencine-pins.txt'
              - 'scripts/checkout-opencine.sh'
              - 'justfile'
              - '.github/workflows/ci.yml'
            android:
              - 'Apps/Android/**'
              - 'Sources/OpenInstaViewCore/**'
              - 'Sources/OpenInstaCineAndroidFacade/**'
              - 'Package.swift'
              - 'opencine-pins.txt'
              - 'scripts/checkout-opencine.sh'
              - 'scripts/android-*.sh'
              - 'scripts/ci-install-swift-android.sh'
              # Applied to every Android Gradle invocation in CI.
              - 'scripts/ci-gradle-task-timing.gradle'
              - 'justfile'
              - '.github/workflows/ci.yml'
            handbook:
              - 'handbook/**'
              - '.github/workflows/ci.yml'

  native:
    name: Native Swift/iOS
    needs: changes
    # Hosted macOS is free on public repositories only. Never move this to a
    # self-hosted runner: it runs pull-request code.
    if: ${{ needs.changes.outputs.code == 'true' && !github.event.repository.private }}
    runs-on: macos-latest
    # The nightly tier adds `just core-test` and the portrait header layout matrix, and hands its
    # build to the iPad oracle job.
    timeout-minutes: ${{ inputs.full && 90 || 45 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Install native tooling
        run: brew install just xcodegen || true
      # Candidate (OpenCine): ios/project.yml takes MonitorUI and MonitorPresentation, OpenCineCore
      # plus OpenCineMedia (also Package.swift), and Insta360Protocol plus Insta360Apple
      # (`just core-test` tests them nightly) from ../OpenCine, one sibling checkout pinned by SHA in
      # opencine-pins.txt. Works only once that repository is published. Delete when the app pins
      # it by url + version.
      - name: Check out pinned OpenCine next to the repository
        run: scripts/checkout-opencine.sh
      - name: Xcode version for the cache key
        id: xcode
        run: echo "version=$(xcodebuild -version | awk 'NR == 1 { print $2 }')" >> "$GITHUB_OUTPUT"
      # SwiftPM checkouts (not the 2.9 GB sentry-cocoa binary artifact, a quick download) and Xcode's
      # content-addressed compilation cache, keyed on the package
      # pins, the OpenCine pin and Xcode. Saved only from main; pull requests read main's.
      # No workspace-state.json either: it records that artifact as present, so Xcode skips the download.
      - name: Restore Xcode package and compilation caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/ci-dd/SourcePackages/checkouts
            ~/ci-dd/SourcePackages/repositories
            ~/ci-dd/CompilationCache.noindex
            ~/ci-dd/ModuleCache.noindex
          key: ios-xcode-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/Package.resolved', 'opencine-pins.txt') }}-${{ github.sha }}
          restore-keys: |
            ios-xcode-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/Package.resolved', 'opencine-pins.txt') }}-
            ios-xcode-${{ steps.xcode.outputs.version }}-
      # OpenCine's own CI already runs its Insta360 tests at the pinned commit; the app's PR tier
      # runs only the app package, the nightly tier both (`just core-test`).
      # The log feeds the per-suite timing table in the job summary.
      - name: Swift packages
        env:
          SWIFT_TESTS: ${{ inputs.full && 'just core-test' || 'swift test' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-ios"
          $SWIFT_TESTS 2>&1 | tee "$RUNNER_TEMP/native-ios/swift-test.log"
      # One build of the app and its unit tests; every test run below reuses it without building.
      # Hosted runners are arm64: an x86_64 simulator slice only doubles the compile.
      - name: Build the app and its tests (iOS Simulator)
        run: |
          just ios-generate
          xcodebuild -project ios/OpenInstaCine.xcodeproj -scheme OpenInstaCine \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ~/ci-dd \
            -skipMacroValidation -skipPackagePluginValidation COMPILATION_CACHE_ENABLE_CACHING=YES ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build-for-testing
      # Nightly tier: the iPad oracle job runs this build on its own private iPad, which it boots
      # while this job tests the packages and builds. tar keeps the executable bits an artifact zip
      # drops; the Xcode version lets that job refuse a build from another Xcode. The name carries
      # the run attempt, so a rerun's oracle waits for this attempt's build, not an earlier one.
      - name: Package the build for the iPad oracle job
        if: ${{ inputs.full }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build-for-testing"
          tar -C ~/ci-dd/Build -cf "$RUNNER_TEMP/build-for-testing/products.tar" Products
          xcodebuild -version > "$RUNNER_TEMP/build-for-testing/xcode-version.txt"
      - name: Hand the build to the iPad oracle job
        if: ${{ inputs.full }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-build-for-testing-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-for-testing
          retention-days: 1
          compression-level: 1
          if-no-files-found: error
      # The portrait header layout matrix (MonitorPortraitHeaderClearanceTests) renders the monitor
      # at every size: nightly tier only (docs/ci.md).
      - name: iOS unit tests
        # Xcode forwards TEST_RUNNER_ variables into the test host.
        # Preserve the existing hosted-CI versus hardware timing contract.
        env:
          TEST_RUNNER_CI: "true"
          SKIP: ${{ inputs.full && 'MonitorPortraitHeaderClearanceTests/testCompactDeclaredGaugeRetainsClearanceWhenSafeTopChanges' || 'MonitorPortraitHeaderClearanceTests' }}
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && !found { print $2; found = 1 }')"
          xcodebuild -project ios/OpenInstaCine.xcodeproj -scheme OpenInstaCine \
            -destination "platform=iOS Simulator,id=$device_id" -derivedDataPath ~/ci-dd \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/native-ios/OpenInstaCine.xcresult" \
            -only-testing:OpenInstaCineTests "-skip-testing:OpenInstaCineTests/$SKIP" test-without-building
      # Per-suite timing for the package tests and the iOS unit tests, in the job summary and the log.
      # Reporting never decides the verdict; the meta job tests the script.
      - name: Summarize test timing
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/ci-test-timing.py swift-testing "$RUNNER_TEMP/native-ios/swift-test.log" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/ci-test-timing.py xcresult "$RUNNER_TEMP/native-ios/OpenInstaCine.xcresult" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save Xcode package and compilation caches
        if: ${{ success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/ci-dd/SourcePackages/checkouts
            ~/ci-dd/SourcePackages/repositories
            ~/ci-dd/CompilationCache.noindex
            ~/ci-dd/ModuleCache.noindex
          key: ios-xcode-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/Package.resolved', 'opencine-pins.txt') }}-${{ github.sha }}

  ipad-oracle:
    name: Original storage oracle, native 2x iPad
    needs: changes
    # Nightly tier (docs/ci.md). The oracle needs an iPad at 2x, so it gets its own simulator, and
    # creating that simulator took 4 to 7 minutes on hosted runners. This job does that beside the
    # native job, then runs the native job's build without building: the native job no longer
    # waits for a second simulator, and the app is built once. Hosted macOS, public repositories
    # only, for the same reasons as `native`.
    if: ${{ inputs.full && needs.changes.outputs.code == 'true' && !github.event.repository.private }}
    runs-on: macos-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read # find and download the native job's build in this run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      # The private simulator script, and the same source tree the native job built from.
      - name: Check out pinned OpenCine next to the repository
        run: scripts/checkout-opencine.sh
      - name: Create a private native 2x iPad
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-storage-oracle"
          udid=$(python3 ../OpenCine/scripts/ios-private-simulator.py create \
            "opc-insta-storage-2x-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --device "iPad Pro 11-inch (M4)" --report "$RUNNER_TEMP/native-storage-oracle/simulator-setup.json")
          echo "ORACLE_DEVICE_ID=$udid" >> "$GITHUB_ENV"
      - name: Wait for the native job's build
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci-wait-for-artifact.sh ios-build-for-testing "Native Swift/iOS" "$RUNNER_TEMP/build-for-testing"
      - name: Original storage oracle on a private native 2x iPad
        # Xcode forwards TEST_RUNNER_ variables into the test host.
        env:
          TEST_RUNNER_CI: "true"
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/build-for-testing"
          if [ "$(cat "$build/xcode-version.txt")" != "$(xcodebuild -version)" ]; then
            echo "::error::The native job built with $(head -1 "$build/xcode-version.txt"), this runner has $(xcodebuild -version | head -1)"
            exit 1
          fi
          mkdir -p ~/ci-dd/Build
          tar -C ~/ci-dd/Build -xf "$build/products.tar"
          xctestruns=(~/ci-dd/Build/Products/*.xctestrun)
          if [ "${#xctestruns[@]}" -ne 1 ] || [ ! -f "${xctestruns[0]}" ]; then
            echo "::error::Expected one .xctestrun in the build, found: ${xctestruns[*]}"
            exit 1
          fi
          xcodebuild -xctestrun "${xctestruns[0]}" \
            -destination "platform=iOS Simulator,id=$ORACLE_DEVICE_ID" -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/native-storage-oracle/storage-oracle.xcresult" \
            -only-testing:OpenInstaCineTests/MonitorPortraitHeaderClearanceTests/testCompactDeclaredGaugeRetainsClearanceWhenSafeTopChanges \
            test-without-building
      - name: Delete the private iPad
        if: always()
        run: |
          if [ -n "${ORACLE_DEVICE_ID:-}" ]; then
            python3 ../OpenCine/scripts/ios-private-simulator.py delete "$ORACLE_DEVICE_ID"
          fi
      - name: Retain original storage oracle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-storage-oracle-evidence
          path: ${{ runner.temp }}/native-storage-oracle
          retention-days: 7
          if-no-files-found: error
      # Reporting never decides the verdict; the meta job tests the script.
      - name: Summarize test timing
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/ci-test-timing.py xcresult "$RUNNER_TEMP/native-storage-oracle/storage-oracle.xcresult" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  conformance:
    name: Shared conformance scenarios, iOS
    needs: changes
    # Nightly tier, QUARANTINE (docs/ci.md). Hosted macOS, public repositories only, for the same
    # reasons as `native`: it runs code from the pull request.
    if: ${{ inputs.full && needs.changes.outputs.code == 'true' && !github.event.repository.private }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Install native tooling
        run: brew install just xcodegen || true
      - name: Check out pinned OpenCine next to the repository
        run: scripts/checkout-opencine.sh
      # OpenCine's scripts/ios-private-simulator.py: a new iPhone 16 Pro with accessibility enabled in
      # its own preference store only, the setup every app's conformance job shares.
      - name: Create a private simulator with accessibility enabled
        run: |
          mkdir -p "$RUNNER_TEMP/conformance-ios"
          udid=$(../OpenCine/scripts/ios-private-simulator.py create \
            "opc-insta-conformance-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --report "$RUNNER_TEMP/conformance-ios/simulator-setup.json")
          echo "CONFORMANCE_DEVICE_ID=$udid" >> "$GITHUB_ENV"
      - name: Run the shared scenarios (OpenInstaCineUIReview)
        run: just conformance-ios "$CONFORMANCE_DEVICE_ID" "$RUNNER_TEMP/conformance-ios/OpenInstaCineUIReview.xcresult"
      - name: Delete the private simulator
        if: always()
        run: |
          if [ -n "${CONFORMANCE_DEVICE_ID:-}" ]; then
            ../OpenCine/scripts/ios-private-simulator.py delete "$CONFORMANCE_DEVICE_ID"
          fi
      - name: Retain conformance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-ios-evidence
          path: ${{ runner.temp }}/conformance-ios
          retention-days: 7
          if-no-files-found: warn

  android:
    name: Android (${{ matrix.part }})
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Three Gradle invocations on parallel runners instead of one serial step. Together they
    # schedule exactly the task graph of the former single step (docs/ci.md); each stages the
    # Swift core itself. The gate sees one `android` result: failure if any part fails, so every
    # part stays required.
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: JVM tests
            tasks: :monitor:testDebugUnitTest
          - part: debug build and lint
            tasks: :app:assembleDebug :app:lintDebug :monitor:lintDebug
          # R8 only runs in the release bundle, and :app:verifyReleaseComponentRegistrars
          # (OpenCine's dex check) fails when it strips the ML Kit ComponentRegistrar
          # constructors (OPENINSTACINE-ANDROID-1). Unsigned without the Play keystore.
          - part: release bundle
            tasks: :app:verifyReleaseComponentRegistrars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # OpenCine candidate wiring. Apps/Android/settings.gradle.kts includes ../../../OpenCine/Android
      # (monitor-ui, core, media, vulkan, the Insta360 shell contract and Luna adapter; their tests run
      # in OpenCine's CI), and the Swift Android core links OpenCineMedia from ../OpenCine: one sibling
      # checkout pinned by SHA in opencine-pins.txt. Works only once that remote exists (owner/URL
      # not final).
      - name: Check out pinned OpenCine next to the repository
        run: scripts/checkout-opencine.sh
      # The install script needs NDK 27 for the Swift Android SDK sysroot.
      - name: Set up Android NDK 27
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27c
          link-to-sdk: true
      - name: Install Swift Android SDK
        run: ./scripts/ci-install-swift-android.sh
      # The build pins NDK 28 (ndkVersion), which the runner image lacks, so the Android Gradle
      # plugin downloaded it (about 700 MB) inside the Gradle step, where a corrupt download fails
      # the job (2026-10-28: "Error reading Zip content"). Three parallel jobs make that three times
      # as likely, so each installs the pinned NDKs up front and tries a failed install again.
      - name: Install the pinned Android NDK
        run: |
          set -euo pipefail
          versions="$(grep -rhoE --include=build.gradle.kts 'ndkVersion = "[0-9.]+"' Apps/Android ../OpenCine/Android \
            | grep -oE '[0-9.]+' | sort -u)"
          [ -n "$versions" ] || { echo "::error::No ndkVersion found in the Gradle builds"; exit 1; }
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for version in $versions; do
            for attempt in 1 2 3; do
              "$sdkmanager" --install "ndk;$version" > /dev/null || true
              [ -f "$ANDROID_HOME/ndk/$version/source.properties" ] && break
              echo "::warning::NDK $version install attempt $attempt failed"
              rm -rf "${ANDROID_HOME:?}/ndk/$version"
              [ "$attempt" -lt 3 ] || { echo "::error::Could not install NDK $version"; exit 1; }
            done
            echo "NDK $version installed"
          done
      # The release bundle part runs on every pull request, as OpenZCine does.
      - name: Gradle, ${{ matrix.part }}
        working-directory: Apps/Android
        env:
          SWIFT_ANDROID_SDK_ID: swift-6.3.3-RELEASE_android
          CI_GRADLE_TASK_TIMING: ${{ runner.temp }}/gradle-task-timing.tsv
          TASKS: ${{ matrix.tasks }}
        run: |
          set -euo pipefail
          read -ra tasks <<< "$TASKS"
          ./gradlew --init-script ../../scripts/ci-gradle-task-timing.gradle "${tasks[@]}"
      # Per-task times and, for the JVM tests, per-suite times in the job summary and the log.
      # Reporting never decides the verdict; the meta job tests the script.
      - name: Summarize Gradle timing
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/ci-test-timing.py gradle "$RUNNER_TEMP/gradle-task-timing.tsv" Apps/Android \
            | tee -a "$GITHUB_STEP_SUMMARY"

  handbook:
    name: Handbook
    needs: changes
    if: ${{ needs.changes.outputs.handbook == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same pin as OpenPocketCine's handbook job. Astro needs Node 22.12 or newer.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: handbook/package-lock.json
      - name: Install handbook dependencies
        run: npm --prefix handbook ci
      - name: Build handbook at /openinstacine/docs/
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          HANDBOOK_BASE: /openinstacine/docs
        run: npm --prefix handbook run build

  gate:
    name: CI gate
    # The single required status check on `main`. Always runs and collapses every
    # other job into one verdict; path-filter and private-repo skips are success.
    if: always()
    # The conformance job is nightly-only and quarantined (docs/ci.md): it never feeds the gate.
    # The iPad oracle is nightly-only and skipped (a pass) on pull requests.
    needs: [meta, changes, native, ipad-oracle, android, handbook]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require every job to have passed or been deliberately skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::a CI job reported '$result'"
                exit 1
                ;;
            esac
          done
          echo "All CI jobs passed or were skipped: $RESULTS"
