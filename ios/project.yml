name: OpenInstaCine
options:
  bundleIdPrefix: com.opencapture
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: false
  # Xcode Cloud disables SPM auto-resolution; copy ios/Package.resolved into
  # the generated (gitignored) workspace after every xcodegen run.
  postGenCommand: sh sync-package-resolved.sh

packages:
  OpenInstaViewCore:
    path: ..
  # The OpenCine platform package: common camera contracts (OpenCineCore), portable media math
  # (OpenCineMedia, also re-exported by OpenInstaViewCore, whose Package.swift names the same
  # ../OpenCine checkout), shared UI 2.0 (MonitorUI, MonitorPresentation) and the Insta360 Luna
  # integration (Insta360Protocol, Insta360Apple). Candidate: a sibling checkout of OpenCine next
  # to this repository, pinned in opencine-pins.txt. Switch to url + exactVersion once it is
  # published. The app and tests call OpenCineMedia directly, so they link the product themselves.
  OpenCine:
    path: ../../OpenCine
  # OpenCine's optional reporting adapter (sentry-cocoa), its own package in the same checkout.
  OpenCineSentryApple:
    path: ../../OpenCine/Packages/OpenCineSentryApple

targets:
  OpenInstaCine:
    type: application
    platform: iOS
    sources:
      - OpenInstaCine
    postBuildScripts:
      - name: Stamp source revision
        script: bash "${SRCROOT}/../../OpenCine/scripts/sentry/stamp-source-revision.sh"
        # Ordered after Info.plist processing, which otherwise may rerun after it and drop the stamp.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    dependencies:
      - package: OpenInstaViewCore
        product: OpenInstaViewCore
      - package: OpenCine
        product: OpenCineMedia
      - package: OpenCine
        product: OpenCineCameraVocabulary
      - package: OpenCine
        product: OpenCineMotion
      - package: OpenCine
        product: OpenCineAppKitApple
      - package: OpenCine
        product: OpenCineCameraControls
      - package: OpenCine
        product: OpenCineRelay
      - package: OpenCine
        product: OpenCineRelayApple
      - package: OpenCine
        product: OpenCineWatch
      - package: OpenCine
        product: OpenCineFrameIO
      # The shared Frame.io account, sign-in and uploads; Insta keeps its namespaces.
      - package: OpenCine
        product: OpenCineFrameIOApple
      - package: OpenCine
        product: MonitorUI
      - package: OpenCine
        product: MonitorPresentation
      - package: OpenCine
        product: Insta360Protocol
      - package: OpenCine
        product: Insta360Apple
      - package: OpenCine
        product: OpenCineCore
      # The shared app shell (SHELL-02): saved-camera store, cameras model and the cameras and
      # pair screens over the Luna integration.
      - package: OpenCine
        product: OpenCineAppKit
      # The shared reporting adapter: the app shell's reporting sink on the Sentry SDK
      # (sentry-cocoa comes with it, at the version OpenCine pins).
      - package: OpenCineSentryApple
        product: OpenCineSentryApple
      # Apple media runtime (OpenCine plan MEDIA-02): the VideoToolbox decoder runtime under
      # HevcDecoder and decoded-frame leases. iOS app only; the watch never decodes live video.
      - package: OpenCine
        product: OpenCineApple
      - target: OpenInstaCineWatch
        embed: true
        codeSign: true
    settings:
      base:
        # The app shell (CoreBluetooth / Network / Hotspot glue) uses the Swift 5 language mode to
        # keep the prototype moving; the core package stays Swift 6 strict-concurrency and fully tested.
        # ponytail: tighten to Swift 6 once the I/O layer is validated on hardware.
        SWIFT_VERSION: "5.0"
        # Internal device builds need symbols just as distributed builds do.
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        # Same App ID as Android and the App Store Connect record. Enable Hotspot
        # Configuration on this identifier in the Developer portal.
        PRODUCT_BUNDLE_IDENTIFIER: com.opencapture.openinstacine
        PRODUCT_NAME: OpenInstaCine
        TARGETED_DEVICE_FAMILY: "1,2"
        # Do not put XML comments in the entitlements plist. ProcessProductPackaging
        # rewrites it in place (strips comments, retabs) and the build then fails with
        # "Entitlements file was modified during the build".
        CODE_SIGN_ENTITLEMENTS: OpenInstaCine/OpenInstaCine.entitlements
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) CI_SILENCE_GL_DEPRECATION=1"
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -DCI_SILENCE_GL_DEPRECATION"
        # Same team as OpenZCine, which already has the Hotspot Configuration capability.
        DEVELOPMENT_TEAM: "4V4EGQ6LZA"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenInstaCine
        INFOPLIST_KEY_CFBundleName: OpenInstaCine
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_GCSupportsControllerUserInteraction: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIStatusBarHidden: YES
        # YES so SwiftUI `.statusBarHidden` can hide the iPad system bar after launch.
        # `UIStatusBarHidden~ipad` lives in Info-Frameio.plist; INFOPLIST_KEY cannot
        # spell a `~ipad` variant.
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: YES
        # Use spaces: a colon list becomes one invalid string and iOS stays portrait-only.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
        # Native iPad resizing lets UIKit report window-control exclusions.
        # Do not request UIRequiresFullScreen compatibility scaling: it keeps a
        # fixed scene size underneath the system window buttons on iPadOS 26.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "OpenInstaCine uses Bluetooth to find your Insta360 Luna, ask it for approval, and hand off to its Wi-Fi."
        # OpenCineApple links AVFoundation external USB capture support.
        INFOPLIST_KEY_NSCameraUsageDescription: "If you use an external USB capture device on iPad, OpenInstaCine needs camera access to receive its video."
        INFOPLIST_KEY_NSMotionUsageDescription: "OpenInstaCine uses headphone motion so AirPods can aim the gimbal."
        # iOS names the current Wi-Fi only to apps with precise location (Add setup › Wi-Fi).
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "OpenInstaCine uses your location only so iOS can tell it which Wi-Fi this iPhone is on, to offer that network when you add a camera's Wi-Fi setup. Your location is not stored or shared."
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "OpenInstaCine connects to cameras over local Wi-Fi to receive video and control them, and can share the live picture with nearby OpenInstaCine phones."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "OpenInstaCine saves clips you choose to Photos."
        INFOPLIST_FILE: OpenInstaCine/Info-Frameio.plist
    configFiles:
      Debug: OpenInstaCine/Frameio.xcconfig
      Release: OpenInstaCine/Frameio.xcconfig

  OpenInstaCineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OpenInstaCineTests
    dependencies:
      - target: OpenInstaCine
      - package: OpenInstaViewCore
        product: OpenInstaViewCore
      - package: OpenCine
        product: OpenCineMedia
      # Original shared-math calibration fixtures explicitly select their DJI source profile.
      - package: OpenCine
        product: OpenCineDJI
      - package: OpenCine
        product: OpenCineCameraVocabulary
      - package: OpenCine
        product: OpenCineMotion
      - package: OpenCine
        product: OpenCineRelay
      - package: OpenCine
        product: OpenCineRelayApple
      - package: OpenCine
        product: Insta360Protocol
      # Also provides the Insta360Apple module; Xcode then shares one Insta360Apple
      # framework between the app and this bundle instead of a second static copy.
      - package: OpenCine
        product: Insta360AppleTestSupport
      - package: OpenCine
        product: OpenCineCore
      # OpenCineAppKit comes from the host app: linking it here too would make it a framework
      # with a second MonitorUI (a second theme accent) inside.
      - package: OpenCine
        product: OpenCineApple
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.opencapture.openinstacine.tests
        DEVELOPMENT_TEAM: "4V4EGQ6LZA"
        CODE_SIGN_STYLE: Automatic
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OpenInstaCine.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OpenInstaCine

  OpenInstaCineWatch:
    type: application
    platform: watchOS
    sources:
      - OpenInstaCineWatch
    dependencies:
      - package: OpenInstaViewCore
        product: OpenInstaViewCore
      # The wrist monitor and its WatchConnectivity client (OpenCineWatch).
      - package: OpenCine
        product: OpenCineWatch
    configFiles:
      Debug: OpenInstaCineWatch/Watch.xcconfig
      Release: OpenInstaCineWatch/Watch.xcconfig
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.opencapture.openinstacine.watch
        PRODUCT_NAME: OpenInstaCineWatch
        TARGETED_DEVICE_FAMILY: "4"
        DEVELOPMENT_TEAM: "4V4EGQ6LZA"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OpenInstaCineWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SDKROOT: watchos
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

  OpenInstaCineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - OpenInstaCineUITests
    dependencies:
      - target: OpenInstaCine
      # The UI tests every app shares (OpenCine OpenCineAppUITesting) and the review contract
      # and capabilities its conformance profile names (MonitorPresentation).
      - package: OpenCine
        product: OpenCineAppUITesting
      - package: OpenCine
        product: MonitorPresentation
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        # Declares the conformance profile before any test runs (ConformanceApp.swift).
        INFOPLIST_KEY_NSPrincipalClass: $(PRODUCT_MODULE_NAME).ConformanceApp
        PRODUCT_BUNDLE_IDENTIFIER: com.opencapture.openinstacine.uitests
        TEST_TARGET_NAME: OpenInstaCine
        DEVELOPMENT_TEAM: "4V4EGQ6LZA"
        CODE_SIGN_STYLE: Automatic

schemes:
  OpenInstaCine:
    build:
      targets:
        OpenInstaCine: all
        OpenInstaCineWatch: all
        OpenInstaCineTests: [test]
    test:
      targets:
        - OpenInstaCineTests
  OpenInstaCineWatch:
    build:
      targets:
        OpenInstaCineWatch: all
  OpenInstaCineUIReview:
    build:
      targets:
        OpenInstaCine: all
        OpenInstaCineUITests: [test]
    test:
      targets:
        - OpenInstaCineUITests
