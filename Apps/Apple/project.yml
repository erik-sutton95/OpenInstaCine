name: OpenInstaCine
options:
  bundleIdPrefix: com.opencapture
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SharedMonitorEngine:
    path: ../..
  Insta360Protocol:
    path: ../../Adapters/Insta360Protocol
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "4V4EGQ6LZA"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    SUPPORTS_MACCATALYST: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "17"
    GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) CI_SILENCE_GL_DEPRECATION=1"
    OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -DCI_SILENCE_GL_DEPRECATION"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
targets:
  Insta360Apple:
    type: framework
    platform: iOS
    sources:
      - ../../Adapters/Insta360Apple/Sources/Insta360Apple
      - path: ../../Adapters/Insta360Apple/Sources/CKcp
        excludes:
          - module.modulemap
          - LICENSE
    dependencies:
      - package: SharedMonitorEngine
        product: MonitorContracts
      - package: Insta360Protocol
        product: Insta360Protocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opencapture.insta360adapter
        CLANG_ENABLE_MODULES: YES
  OpenInstaCine:
    type: application
    platform: iOS
    sources:
      - path: OpenInstaCine
        excludes: ["*.xcconfig", "*.example"]
      - path: ../../Shared/Apple/MonitorShell
        excludes: ["Assets.xcassets"]
      - path: ../../Resources/CameraLUTs/luts
        buildPhase: resources
    dependencies:
      - target: Insta360Apple
      - package: SharedMonitorEngine
        product: OpenPocketViewCore
      - package: SharedMonitorEngine
        product: MonitorUI
      - package: SharedMonitorEngine
        product: MonitorPresentation
      - package: SharedMonitorEngine
        product: MonitorContracts
      - package: Insta360Protocol
        product: Insta360Protocol
    configFiles:
      Debug: OpenInstaCine/Frameio.xcconfig
      Release: OpenInstaCine/Frameio.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opencapture.openinstacine
        PRODUCT_NAME: OpenInstaCine
        CODE_SIGN_ENTITLEMENTS: OpenInstaCine/OpenInstaCine.entitlements
        INFOPLIST_FILE: OpenInstaCine/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: OpenInstaCine
        INFOPLIST_KEY_CFBundleName: OpenInstaCine
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_GCSupportsControllerUserInteraction: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: YES
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "OpenInstaCine uses Bluetooth to discover and connect your Insta360 camera."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "OpenInstaCine receives the live picture over your camera's own Wi-Fi."
        INFOPLIST_KEY_NSMotionUsageDescription: "OpenInstaCine can use headphone motion with cameras that support gimbal control."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "OpenInstaCine saves clips you choose to Photos."
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
  LunaOfficialUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - LunaOfficialUITests
    dependencies:
      - target: OpenInstaCine
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.opencapture.openinstacine.official-uitests
        TEST_TARGET_NAME: OpenInstaCine
        DEVELOPMENT_TEAM: "4V4EGQ6LZA"
        CODE_SIGN_STYLE: Automatic
schemes:
  OpenInstaCine:
    build:
      targets:
        OpenInstaCine: all
    test:
      targets: []
  LunaOfficialCapture:
    build:
      targets:
        OpenInstaCine: all
        LunaOfficialUITests: [test]
    test:
      targets:
        - LunaOfficialUITests
